name: APK yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/debug/app-debug.apk SoglomHayot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoglomHayot-apk
          path: SoglomHayot.apk

      - name: Yuklab olish sahifasiga joylash (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sog'lom Hayot ${{ github.run_number }}
          body: Telefonga yuklab oling va o'rnating (SoglomHayot.apk).
          files: SoglomHayot.apk
