name: APK yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/debug/app-debug.apk SoglomHayot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoglomHayot-apk
          path: SoglomHayot.apk

      - name: APK ni "apk" shoxobchasiga joylash (doimiy yuklab olish havolasi)
        run: |
          mkdir out && cp SoglomHayot.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add SoglomHayot.apk
          git commit -q -m "APK ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Yuklab olish sahifasiga joylash (Releases)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SoglomHayot.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Sog'lom Hayot 1.0.${{ github.run_number }}" \
            --notes "Telefonga yuklab oling va o'rnating (SoglomHayot.apk)."
