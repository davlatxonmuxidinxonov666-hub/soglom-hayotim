name: APK yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ISSAI modeli keshi
        id: mcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/ai
          key: cafsd-yolov8n-tflite-v1

      - uses: actions/setup-python@v5
        if: steps.mcache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: ISSAI modelini telefon formatiga o'tkazish (TFLite)
        if: steps.mcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p /tmp/m app/src/main/assets/ai
          cat > /tmp/m/conv.py <<'PY'
          import glob, shutil, sys
          from ultralytics import YOLO
          m = YOLO('/tmp/m/cafsd.pt')
          names = m.names
          print(len(names), 'labels')
          out = m.export(format='tflite', imgsz=640, half=True)
          print('exported', out)
          fs = sorted(glob.glob('/tmp/m/**/*float16.tflite', recursive=True)) or sorted(glob.glob('/tmp/m/**/*.tflite', recursive=True))
          dst = sys.argv[1]
          shutil.copy(fs[0], dst + '/food.tflite')
          with open(dst + '/labels.txt', 'w') as fh:
              fh.write('\n'.join(names[i] for i in range(len(names))))
          PY
          fail() { echo "::error title=$1::$(tail -c 3000 /tmp/m/log.txt | tr '\n' ' ')"; rm -rf "${{ github.workspace }}/app/src/main/assets/ai"; exit 1; }
          curl -fL --retry 3 -o /tmp/m/cafsd.pt https://issai.nu.edu.kz/wp-content/themes/issai-new/data/models/CAFSD/yolov8n.pt > /tmp/m/log_dl.txt 2>&1 || { cp /tmp/m/log_dl.txt /tmp/m/log.txt; fail "yuklab olish"; }
          ls -la /tmp/m/cafsd.pt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.4.1" "torchvision==0.19.1" "ultralytics==8.3.100" "numpy<2" "tensorflow==2.18.0" "tf_keras==2.18.0" "onnx==1.17.0" "onnx2tf==1.26.3" "onnxslim==0.1.48" "onnxruntime==1.20.1" "sng4onnx==1.0.4" "onnx_graphsurgeon==0.5.2" "ai-edge-litert==1.2.0" "protobuf<5" > /tmp/m/log_pip.txt 2>&1 || { cp /tmp/m/log_pip.txt /tmp/m/log.txt; fail "pip"; }
          cd /tmp/m && python conv.py "${{ github.workspace }}/app/src/main/assets/ai" > /tmp/m/log.txt 2>&1 || fail "eksport"
          tail -5 /tmp/m/log.txt
          ls -la "${{ github.workspace }}/app/src/main/assets/ai"

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/debug/app-debug.apk SoglomHayot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoglomHayot-apk
          path: SoglomHayot.apk

      - name: APK ni "apk" shoxobchasiga joylash (doimiy yuklab olish havolasi)
        run: |
          mkdir out && cp SoglomHayot.apk out/
          cp app/src/main/assets/ai/labels.txt out/ 2>/dev/null || true
          for f in /tmp/m/log*.txt; do [ -f "$f" ] && tail -c 20000 "$f" > "out/model_$(basename $f)"; done; true
          git -C out status >/dev/null 2>&1 || true
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "APK ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Yuklab olish sahifasiga joylash (Releases)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SoglomHayot.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Sog'lom Hayot 1.0.${{ github.run_number }}" \
            --notes "Telefonga yuklab oling va o'rnating (SoglomHayot.apk)."
