name: APK yig'ish

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ISSAI modeli keshi
        id: mcache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/ai
          key: cafsd-yolov8n-tflite-v1

      - uses: actions/setup-python@v5
        if: steps.mcache.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: ISSAI modelini telefon formatiga o'tkazish (TFLite)
        if: steps.mcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/m app/src/main/assets/ai
          cd /tmp/m
          curl -fL --retry 3 -o cafsd.pt https://issai.nu.edu.kz/wp-content/themes/issai-new/data/models/CAFSD/yolov8n.pt
          pip install -q "ultralytics>=8.3,<8.5"
          python - <<'PY'
          from ultralytics import YOLO
          import json, glob, shutil
          m = YOLO('cafsd.pt')
          names = m.names
          out = m.export(format='tflite', imgsz=640, half=True)
          print('exported', out)
          f = sorted(glob.glob('**/*float16.tflite', recursive=True) or glob.glob('**/*.tflite', recursive=True))[0]
          dst = '${{ github.workspace }}/app/src/main/assets/ai/'
          shutil.copy(f, dst + 'food.tflite')
          with open(dst + 'labels.txt', 'w') as fh:
              fh.write('\n'.join(names[i] for i in range(len(names))))
          print(len(names), 'labels')
          PY
          ls -la ${{ github.workspace }}/app/src/main/assets/ai

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/debug/app-debug.apk SoglomHayot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoglomHayot-apk
          path: SoglomHayot.apk

      - name: APK ni "apk" shoxobchasiga joylash (doimiy yuklab olish havolasi)
        run: |
          mkdir out && cp SoglomHayot.apk out/ && cp app/src/main/assets/ai/labels.txt out/ 2>/dev/null || true
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add SoglomHayot.apk labels.txt 2>/dev/null || git add SoglomHayot.apk
          git commit -q -m "APK ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk

      - name: Yuklab olish sahifasiga joylash (Releases)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SoglomHayot.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Sog'lom Hayot 1.0.${{ github.run_number }}" \
            --notes "Telefonga yuklab oling va o'rnating (SoglomHayot.apk)."
