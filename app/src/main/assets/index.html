<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sog'lom Hayot</title>
<style>
:root{--pri:#059669;--pri2:#10B981;--grad:linear-gradient(135deg,#10B981 0%,#0D9488 55%,#0891B2 100%);--acc:#F97316;--bg:#EEF8F4;--card:#fff;--txt:#0B1F1A;--muted:#5F756F;--line:#E1ECE8;--track:#E3EFEA;--bad:#E11D48;--good:#059669;--warn:#EA580C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15.5px/1.45 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 100% 0,#D1FAE5 0,transparent 40%),radial-gradient(circle at 0 30%,#E0F2FE 0,transparent 35%),var(--bg);background-attachment:fixed;min-height:100vh}
#view{padding:12px 12px 96px;max-width:640px;margin:0 auto}
h1{font-size:28px;margin:6px 0}
h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h3{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(5,80,60,.07),0 1px 2px rgba(5,80,60,.05)}
.center{text-align:center}
.badge{background:var(--grad);color:#fff;font-size:12px;padding:2px 9px;border-radius:20px}
.datebar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.datebar b{font-size:19px}
.datebar button{width:42px;height:42px;border-radius:14px;border:0;background:var(--card);font-size:24px;color:var(--pri);box-shadow:0 2px 8px rgba(5,80,60,.08);transition:transform .15s}
.datebar button:active{transform:scale(.9)}
.datebar button:disabled{opacity:.3}
/* Hero */
.hero{display:flex;align-items:center;gap:14px;background:var(--grad);color:#fff;--track:rgba(255,255,255,.22);position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(13,148,136,.35)}
.hero:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);right:-70px;top:-90px}
.hero.over{background:linear-gradient(135deg,#F43F5E,#E11D48 55%,#BE123C);box-shadow:0 10px 24px rgba(225,29,72,.35)}
.ringwrap{position:relative;display:inline-block;flex-shrink:0}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-size:30px;line-height:1.05;font-weight:800}
.ringtxt span{font-size:11.5px;opacity:.9;max-width:104px;line-height:1.2}
.herolist{flex:1;position:relative}
.herolist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.herolist span{opacity:.92;font-size:14px}
.heroHint{margin:8px 0 0;font-size:12.5px;opacity:.95;background:rgba(255,255,255,.16);padding:6px 9px;border-radius:10px}
/* Stats */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center}
.stats3 div{background:var(--bg);border-radius:14px;padding:9px 4px}
.stats3 span{display:block;font-size:12px;color:var(--muted)}
.stats3 b{display:block;font-size:20px;font-weight:800}
.stats3 small{font-size:11px;color:var(--muted)}
.s-eat{background:#ECFDF5!important}.s-eat b{color:#059669}
.s-burn{background:#FFF7ED!important}.s-burn b{color:#EA580C}
.s-plus{background:#FFF1F2!important}.s-plus b{color:#E11D48}
.s-minus{background:#EFF6FF!important}.s-minus b{color:#2563EB}
.good{color:var(--good)} .warn{color:var(--warn)}
.hint{color:var(--muted);font-size:13.5px;margin:4px 0 8px}
.hint.ok{color:var(--good);font-weight:600}
.hint a{color:var(--muted);text-decoration:underline;margin-left:6px;font-weight:400}
.mbar{margin:10px 0}
.mrow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.mrow small{color:var(--muted);font-weight:400}
.track{height:10px;background:var(--track);border-radius:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:8px}
/* Tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;margin:0 0 12px;color:#fff;--track:rgba(255,255,255,.28)}
.tile.steps{background:linear-gradient(140deg,#FB923C,#F97316 50%,#EA580C);box-shadow:0 8px 18px rgba(249,115,22,.3)}
.tile.water{background:linear-gradient(140deg,#38BDF8,#0EA5E9 50%,#0284C7);box-shadow:0 8px 18px rgba(14,165,233,.3)}
.tile b{font-size:22px;display:block;font-weight:800}
.tile span{display:block;font-size:12px;opacity:.92}
.tring{position:relative;width:64px;height:64px}
.tring i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px}
.wbtn{display:flex;gap:6px;margin-top:7px}
.wbtn button{flex:1;border:0;border-radius:11px;padding:8px 0;background:rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:13.5px;transition:transform .15s}
.wbtn button:active{transform:scale(.92);background:rgba(255,255,255,.4)}
.wbtn button:last-child{flex:2;background:#fff;color:#0284C7}
/* Guide */
.guide{border:2px solid #A7F3D0;background:linear-gradient(180deg,#F0FDF9,#fff)}
.ghead{display:flex;justify-content:space-between;align-items:center}
.guide .track{margin:4px 0 8px}
.gstep{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:14.5px;border-radius:10px}
.gstep span{width:24px;height:24px;border-radius:50%;border:2px solid #A7F3D0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0}
.gstep.ok{color:var(--muted);text-decoration:line-through}
.gstep.ok span{background:var(--grad);border-color:transparent}
.gstep em{margin-left:auto;font-style:normal;color:var(--pri);font-size:20px}
.gstep:not(.ok):active{background:#ECFDF5}
/* Meals */
.meal{padding:6px 0 8px;border-bottom:1px solid var(--line)}
.meal:last-child{border:0}
.mhead{display:flex;align-items:center;gap:8px;padding:4px 0}
.mhead b{flex:1;display:flex;align-items:center;gap:8px;font-size:16px}
.mhead span{color:var(--muted);font-size:13px}
.mico{font-style:normal;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px}
.m-breakfast .mico{background:#FFEDD5}.m-lunch .mico{background:#FEF9C3}.m-snack .mico{background:#DCFCE7}.m-dinner .mico{background:#E0E7FF}
.plus{width:30px;height:30px;border-radius:10px;border:0;background:#ECFDF5;color:var(--pri);font-size:20px;font-weight:700;line-height:1}
.empty{color:#94A3B8;font-size:13.5px;padding:6px 0 4px 42px}
.fitem{display:flex;align-items:center;gap:10px;padding:7px 0}
.fitem>div:nth-child(2),.fitem>div:first-child:not(.fk){flex:1;min-width:0}
.fitem.small{padding:4px 0;font-size:14px}
.fitem.small .fn{flex:1}
.av{font-style:normal;width:34px;height:34px;border-radius:11px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.av.big{width:52px;height:52px;font-size:28px;border-radius:16px}
.c-uz{background:#FFEDD5}.c-non{background:#FEF3C7}.c-meat{background:#FFE4E6}.c-garnish{background:#F5F5F4}.c-dairy{background:#E0F2FE}.c-salad{background:#DCFCE7}.c-fruit{background:#FCE7F3}.c-nuts{background:#FEF9C3}.c-sweet{background:#FAE8FF}.c-drink{background:#CFFAFE}.c-fast{background:#FFEDD5}.c-other{background:#F1F5F9}.c-custom{background:#EDE9FE}
.fn{font-weight:650}
.fs{font-size:12px;color:var(--muted)}
.fk{font-weight:800;text-align:right;white-space:nowrap;color:var(--pri)}
.fk small,.pk small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.x{border:0;background:none;color:#A3B5B0;font-size:22px;width:30px;height:30px;line-height:1;border-radius:9px}
.x:active{background:#FFE4E6;color:var(--bad)}
/* Buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:800;margin-top:12px;background:var(--bg);color:var(--txt);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.35)}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid #CDEDE2}
.btn.link{background:none;color:var(--muted);font-weight:600;margin-top:4px}
.btn.small{width:auto;padding:10px 18px;margin:0;font-size:15px}
.btn.big{padding:17px;font-size:17px}
.btn.danger{color:var(--bad);border-color:#FECDD3} .btn.primary.danger{background:linear-gradient(135deg,#FB7185,#E11D48);color:#fff}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 16px rgba(13,148,136,.35)}50%{box-shadow:0 6px 26px rgba(13,148,136,.6)}}
.inp,textarea,select{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 13px;font:inherit;background:#fff;color:var(--txt);outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus,textarea:focus,select:focus{border-color:var(--pri2);box-shadow:0 0 0 4px rgba(16,185,129,.15)}
textarea{resize:none;font-size:16.5px}
label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 5px;font-weight:600}
.stepLbl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:14px 0 7px}
.stepLbl i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 2px;align-items:center}
.chips.center{justify-content:center}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.exl{font-size:12.5px;color:var(--muted)}
.chip{border:2px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font:inherit;font-size:14px;color:var(--txt);white-space:nowrap;transition:all .18s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(13,148,136,.3)}
.chip.light{background:#ECFDF5;border-color:#A7F3D0;color:#047857;font-size:13px;padding:5px 11px}
.res{margin-top:12px;border-top:2px dashed var(--line);padding-top:6px}
.warnbox{background:#FFF7ED;border:2px solid #FED7AA;border-radius:14px;padding:11px 13px;color:#9A3412;margin-top:10px}
.warnbox .btn{margin-top:8px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .pctl{flex-basis:100%;margin-top:2px}
.prow .pctl select{flex:1;width:auto}
.pname{flex:1;min-width:0;font-weight:700;font-size:15px}
.pname small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.pctl{display:flex;gap:6px}
.pctl input{width:64px;border:2px solid var(--line);border-radius:11px;padding:7px 4px;text-align:center;font:inherit;font-size:15px;font-weight:700}
.pctl select{width:86px;padding:7px 6px;font-size:14px;border-radius:11px}
.pctl.wide{margin:12px 0}
.pctl.wide input{width:96px;font-size:18px}
.pctl.wide select{flex:1;width:auto;font-size:15px}
.pk{font-weight:800;min-width:52px;text-align:right;color:var(--pri);font-size:17px}
.ptotal{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-top:10px;font-size:17px;background:#ECFDF5;border-radius:14px}
.ptotal b{color:var(--pri);font-size:20px}
.litem{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:12px;transition:background .15s}
.litem>div:nth-child(2){flex:1;min-width:0}
.litem:active{background:#ECFDF5}
.search{margin-top:6px}
.inrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.inrow .unit{color:var(--muted)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big{font-size:38px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.big b{font-weight:900}
.big small{font-size:15px;font-weight:500;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;margin-top:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-left:8px}
.tips{padding-left:0;margin:0;list-style:none}
.tips li{margin:8px 0;font-size:14.5px;padding:10px 12px 10px 40px;background:#F0FDF9;border-radius:14px;position:relative}
.tips li:before{content:"✓";position:absolute;left:12px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--grad);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
.faq{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{font-weight:700;padding:9px 0;list-style:none;cursor:pointer;display:flex;justify-content:space-between}
.faq summary:after{content:"+";color:var(--pri);font-size:20px;transition:transform .2s}
.faq[open] summary:after{transform:rotate(45deg)}
.faq p{margin:0 0 10px;color:var(--muted);font-size:14px;animation:fade .3s}
.disc{font-size:12px;color:var(--muted);text-align:center;margin:14px 10px}
.mres{font-size:15px;margin:6px 0;padding:12px;background:#ECFDF5;border-radius:14px}
.mres b{font-size:28px;color:var(--pri)}
.mres span{color:var(--muted);font-size:13px}
.mhero{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mhero h2{margin:0}
/* Meal advice */
.mhead .mt{display:flex;flex-direction:column;line-height:1.15;color:var(--txt);font-size:16px}
.mt small{font-size:12px;color:var(--muted);font-weight:500}
.track.thin{height:5px;margin:4px 0 6px 42px}
.tip{width:30px;height:30px;border-radius:10px;border:0;background:#FEF9C3;font-size:15px}
.m-breakfasti{background:#FFEDD5}.m-lunchi{background:#FEF9C3}.m-snacki{background:#DCFCE7}.m-dinneri{background:#E0E7FF}
.advice{background:linear-gradient(135deg,#FEFCE8,#ECFDF5);border:2px solid #FDE68A;border-radius:16px;padding:12px 14px;font-size:14.5px;margin:10px 0 14px}
.advice b{color:#047857}
.opt{border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.optH{display:flex;justify-content:space-between;margin-bottom:4px}
.optH span{color:var(--pri);font-weight:800}
.opt .btn{margin-top:6px;width:100%}
.pmrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pmrow:last-child{border:0}
.pmrow span{flex:1;font-weight:700;display:flex;flex-direction:column}
.pmrow span small{font-weight:400;color:var(--muted);font-size:12px}
.pmrow b{color:var(--pri);font-size:17px}
.pmrow em{font-style:normal;color:var(--pri);font-size:20px}
/* AI */
.aibox{display:flex;gap:8px}
.aibox .cam{flex:1;margin-top:4px;font-size:17px;padding:16px}
.aibox .gal{width:64px;margin-top:4px;font-size:22px;padding:0}
.aiconf{font-style:normal;font-size:11px;background:#EDE9FE;color:#6D28D9;padding:1px 6px;border-radius:8px;font-weight:700}
.aihead{display:flex;gap:12px;align-items:center;margin:6px 0}
.aihead p{margin:0;font-size:13.5px;color:var(--muted)}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:14px;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.warnbox .thumb{float:left;margin:0 12px 6px 0}
.aiwait{text-align:center;padding:20px 0}
.scan{width:120px;height:120px;margin:0 auto 14px;border-radius:30px;background:var(--grad);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.scan i{font-style:normal;font-size:54px}
.scan:after{content:"";position:absolute;left:0;right:0;height:30px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.7),transparent);animation:scan 1.3s ease-in-out infinite}
@keyframes scan{0%{top:-30px}100%{top:120px}}
.guess{margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:#F5F3FF;border:2px dashed #DDD6FE}
.guess small{opacity:.7;font-size:11px}
.prow .av{width:30px;height:30px;font-size:16px;border-radius:10px}
.pname{cursor:pointer}
.pname .swap{color:var(--pri2);font-size:13px;font-weight:700}
.pname small.src{color:#7C3AED;font-style:italic}
.pm{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:var(--pri);flex-shrink:0}
.pm:active{background:#ECFDF5;transform:scale(.92)}
.prow .pctl input{width:58px}
.chips.presets{flex-basis:100%;margin:6px 0 0}
.chip.mini{padding:4px 10px;font-size:12.5px;border-width:1.5px}
.alts{flex-basis:100%;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.chip.alt{background:#F5F3FF;border-color:#DDD6FE;color:#6D28D9}
.unk{margin:10px 0;padding:10px 12px;border-radius:14px;background:#FFF7ED;border:2px dashed #FED7AA;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.unk b{flex-basis:100%;color:#9A3412;font-size:14px}
.unk .hint{flex-basis:100%;margin:2px 0 0}
.chip.warnchip{background:#fff;border-color:#FDBA74;color:#9A3412}
.checkhint{background:#F5F3FF;border-radius:12px;padding:8px 10px;color:#5B21B6}
.addmore{width:100%;margin-top:10px}
.picklist{max-height:52vh;overflow:auto;margin-top:8px}
.quickbox{background:#F0FDF9;border:2px solid #CCFBF1;border-radius:16px;padding:10px 12px;margin:6px 0 4px}
.qlbl{font-size:13px;font-weight:800;color:#047857;margin-top:2px}
.chip.quick{display:flex;flex-direction:column;align-items:flex-start;border-radius:14px;padding:6px 11px;line-height:1.2;background:#fff}
.chip.quick small{font-size:11px;color:var(--muted)}
.chip.quick:active{background:#ECFDF5}
/* Intro */
.intro{text-align:center;padding:40px 14px 20px;min-height:88vh;display:flex;flex-direction:column;justify-content:center}
.introIcon{font-size:76px;width:140px;height:140px;margin:0 auto 18px;border-radius:44px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 36px rgba(13,148,136,.4);animation:float 3s ease-in-out infinite}
.intro h1{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.intro h3{margin-top:0}
.intro p{color:var(--muted);font-size:16px;max-width:380px;margin:8px auto 14px}
.dots{display:flex;justify-content:center;gap:7px;margin:18px 0 4px}
.dots i{width:8px;height:8px;border-radius:5px;background:#CDEDE2;transition:all .3s}
.dots i.on{width:26px;background:var(--grad)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
/* Nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);display:flex;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 16px rgba(5,80,60,.06)}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;font-size:11px;color:var(--muted);padding:5px 0;border-radius:14px;transition:all .2s}
.nav button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.55;transition:all .25s}
.nav button.on{color:var(--pri);font-weight:800;background:#ECFDF5}
.nav button.on i{filter:none;opacity:1;transform:translateY(-2px) scale(1.15)}
/* Modal, toast */
#modal{position:fixed;inset:0;background:rgba(6,30,25,.5);display:flex;align-items:flex-end;z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
#modal.show{opacity:1;pointer-events:auto}
.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#D5E3DE;margin:-10px auto 14px}
#modal.show .sheet{transform:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(30px);background:#0B1F1A;color:#fff;padding:11px 18px;border-radius:22px;font-size:14.5px;opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;z-index:20;display:flex;gap:12px;align-items:center;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{border:0;background:none;color:#6EE7B7;font-weight:800;font:inherit;font-weight:800}
/* Celebrate */
#pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30}
#pop .popin{background:#fff;border-radius:28px;padding:22px 30px;text-align:center;box-shadow:0 20px 50px rgba(5,80,60,.3);opacity:0;transform:scale(.5)}
#pop.show .popin{animation:popIn 1.25s cubic-bezier(.2,.9,.3,1.3) both}
#pop .check{width:66px;height:66px;margin:0 auto 8px;border-radius:50%;background:var(--grad);color:#fff;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center}
#pop.show .check{animation:spinIn .6s .1s cubic-bezier(.2,.9,.3,1.4) both}
#pop b{display:block;font-size:22px;color:var(--pri)}
#pop span{color:var(--muted);font-size:14px}
.conf{position:absolute;left:50%;top:50%;font-style:normal;font-size:22px;opacity:0}
#pop.show .conf{animation:burst 1s ease-out forwards}
@keyframes popIn{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.05)}28%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes spinIn{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(200deg)}}
.drop{position:fixed;font-style:normal;font-size:18px;pointer-events:none;z-index:25;animation:drop .9s ease-out forwards}
@keyframes drop{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-90px) scale(.6)}}
/* Entrance animations */
.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.anim .prog{animation:ringIn 1.1s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.anim .track i{animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.anim .chart rect{transform-box:fill-box;transform-origin:bottom;animation:barUp .8s cubic-bezier(.2,.8,.2,1) both}
.anim .chart rect:nth-of-type(2n){animation-delay:.08s}
@keyframes barUp{from{transform:scaleY(0)}}
.anim .introIcon{animation:popIcon .6s cubic-bezier(.2,.9,.3,1.4) both,float 3s .6s ease-in-out infinite}
@keyframes popIcon{from{transform:scale(.3) rotate(-20deg);opacity:0}}
.res.pop{animation:rise .4s both}
.res.pop .prow{animation:rise .4s both}
.res.pop .prow:nth-child(2){animation-delay:.06s}.res.pop .prow:nth-child(3){animation-delay:.12s}.res.pop .prow:nth-child(4){animation-delay:.18s}.res.pop .prow:nth-child(5){animation-delay:.24s}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media (max-width:360px){.pctl select{width:70px}.pctl input{width:50px}.ringtxt b{font-size:25px}.hero{gap:10px}}
</style>
</head>
